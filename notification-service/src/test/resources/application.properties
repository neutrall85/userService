spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=test-notification-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.aston.homework.intensive.notificationservice.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=ru.aston.homework.intensive.notificationservice.dto.UserEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.user-created=user-created-topic-test
app.kafka.topics.user-deleted=user-deleted-topic-test
app.kafka.group-id=test-notification-service-group

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.ru.aston.homework.intensive.notificationservice=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=WARN
