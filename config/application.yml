spring:
  application:
    name: microservices-config
  cloud:
    config:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.config: DEBUG
    com.example: INFO