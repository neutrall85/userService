server:
  port: 8083

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

        - id: circuit-breaker-service
          uri: lb://CIRCUIT-BREAKER
          predicates:
            - Path=/api/circuit-breakers/**

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

circuitbreaker:
  configs:
    default:
      sliding-window-size: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 5s
  instances:
    userService:
      baseConfig: default
    notificationService:
      baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG